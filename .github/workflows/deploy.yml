name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: Production
      url: https://pipeline.aerisbeaute.com
    env:
      FRONTEND_IMAGE: itaeris/pipeline_frontend_app
      BACKEND_IMAGE: itaeris/pipeline_backend_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Public frontend build args
        id: fe
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          python3 - <<'PY'
          import os
          value = ""
          for line in os.environ.get("FRONTEND_ENV", "").splitlines():
              if line.startswith("NEXT_PUBLIC_TURNSTILE_SITE_KEY="):
                  value = line.split("=", 1)[1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"turnstile={value}\n")
          PY

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.fe.outputs.turnstile }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Write env files
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          dest = Path("env-files")
          dest.mkdir(exist_ok=True)

          def write(filename: str, secret_name: str) -> None:
              raw = os.environ.get(secret_name, "").replace("\r\n", "\n").replace("\r", "\n")
              lines = []
              keys = []
              for line in raw.splitlines():
                  text = line.strip()
                  if not text or text.startswith("#"):
                      continue
                  if text.startswith("export "):
                      text = text[7:].strip()
                  if "=" not in text:
                      continue
                  key, value = text.split("=", 1)
                  key = key.strip()
                  value = value.strip()
                  if not key:
                      continue
                  lines.append(f"{key}={value}")
                  keys.append(key)
              (dest / filename).write_text("\n".join(lines) + ("\n" if lines else ""), encoding="utf-8")
              print(f"{secret_name} keys: {', '.join(keys) or '(empty)'}")
              if "DATABASE_URL" not in keys:
                  raise SystemExit(f"{secret_name} is missing DATABASE_URL")

          write("backend.env", "BACKEND_ENV")
          write("frontend.env", "FRONTEND_ENV")
          PY

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy,env-files"
          target: "/opt/pipeline"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          command_timeout: 20m
          script: |
            set -eu
            chmod +x /opt/pipeline/deploy/remote.sh
            export APP_DIR=/opt/pipeline
            export FRONTEND_IMAGE="itaeris/pipeline_frontend_app:${IMAGE_TAG}"
            export BACKEND_IMAGE="itaeris/pipeline_backend_app:${IMAGE_TAG}"
            /opt/pipeline/deploy/remote.sh
