<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>Offline — Task Management</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
        color: #16324f;
        background:
          radial-gradient(1200px 620px at 0% -8%, #dbeafe 0%, transparent 58%),
          radial-gradient(900px 520px at 100% 0%, #e0f2fe 0%, transparent 52%),
          linear-gradient(180deg, #ffffff 0%, #f3f8ff 46%, #d7ebff 100%);
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 28rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      img {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
      }
      h1 {
        margin: 1rem 0 0.35rem;
        font-size: 2rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
      }
      a {
        margin-top: 1.5rem;
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.65rem 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum bisa dimuat. Cek koneksi, lalu coba lagi.</p>
      <a href="/">Coba lagi</a>
    </main>
  </body>
</html>
